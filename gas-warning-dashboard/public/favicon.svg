<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="45%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#D81B00" />
    </linearGradient>
    <linearGradient id="pixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826" />
      <stop offset="100%" stop-color="#FF4800" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF4500" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Digital Hexagon Outer Shield -->
  <polygon points="50,14 80,31 80,69 50,86 20,69 20,31" 
           fill="url(#flameGrad)" 
           rx="8"
           filter="url(#shadow)" />

  <!-- Digital Dispersal Pixels (Top Right) -->
  <rect x="74" y="16" width="6" height="6" rx="1" fill="url(#pixelGrad)" transform="rotate(-15 77 19)" />
  <rect x="83" y="18" width="6" height="6" rx="1" fill="url(#pixelGrad)" transform="rotate(10 86 21)" />
  <rect x="78" y="25" width="5" height="5" rx="1" fill="url(#pixelGrad)" transform="rotate(-5 80 27)" />
  <rect x="86" y="27" width="5" height="5" rx="1" fill="url(#pixelGrad)" transform="rotate(20 88 29)" />
  <rect x="72" y="26" width="4.5" height="4.5" rx="1" fill="url(#pixelGrad)" />

  <!-- Central Dynamic Flame Cutout (Negative Space / Pure White) -->
  <path d="M 50,25 
           C 54,34 65,46 65,60 
           C 65,71 58,76 50,76 
           C 42,76 35,70 35,60 
           C 35,51 40,46 42,42 
           C 42.5,45 44,48 46,49 
           C 45,41 47,33 50,25 Z" 
        fill="#FFFFFF" />

  <!-- Inner Flame Dynamic Flare (Orange Accent Curve) -->
  <path d="M 46,67 
           C 53,67 57,63 56,56 
           C 54,49 48,44 48,39 
           C 48,46 44,52 44,58 
           C 44,63 45,66 46,67 Z" 
        fill="url(#flameGrad)" 
        opacity="0.15" />
</svg>